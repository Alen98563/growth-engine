name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --release

  economics:
    name: economics model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate the profitability model
        run: python3 scripts/economics_model.py

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed private keys / wallet secrets
        run: |
          set -e
          echo "Scanning tracked files for private-key material..."
          # 0x-prefixed 64-hex private keys (64 chars XOR 40-char addresses)
          if git grep -nE '0x[a-fA-F0-9]{64}' -- . ':!Cargo.lock'; then
            echo "::error::possible 64-hex private key committed"; exit 1
          fi
          if git grep -nE 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}' -- .; then
            echo "::error::possible GitHub token committed"; exit 1
          fi
          if git log --all --diff-filter=A --name-only --pretty=format: | grep -E '(^|/)\.env$'; then
            echo "::error::.env was committed at some point"; exit 1
          fi
          echo "clean."
